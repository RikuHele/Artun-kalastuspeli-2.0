<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arskan kalastuspeli 2</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>

  <main id="menu" class="menu">
    <h1>Arskan kalastuspeli 2</h1>
    <div class="buttons">
      <button id="start-button" class="start" type="button">Aloita peli</button>
      <button id="help-button" class="start" type="button">Ohjeet</button>
    </div>
  </main>

  <main id="help" class="menu" hidden>
    <h2>Ohjeet</h2>
    <div class="help-text">
      <p>Tervetuloa Arskan kalstuspeli 2 pelikokemukseen</p>
      <p>Pelin ideana on kalastaa ja myydä kalojasi torilla asiakkaille.</p>
      <p>Kalastamisessa tulet kohtaamaan Quick Time Eventtejä joissa tarvitset nuolinäppäimiä.</p>
      <p>Kalojen paino ja harvinaisuus vaikuttaa myyntihintaan.</p>
    </div>
    <button id="back-button" class="start" type="button">Takaisin</button>
  </main>

</body>
</html>
